<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav>
        <div class="kiri-navbar">
            <img src="Media Files/icons/logo.svg" width="5%" alt="">
            <h1>MATCHBOARD</h1>
            <P>tactial whiteboard</P>
        </div>
        <div class="kanan-navbar">
            <a href="">Clear</a>
            <div class="icon-kanan-navbar">
                <img src="Media Files/icons/undo.svg" alt="">
                <img src="Media Files/icons/redo.svg" alt="">
                <img src="Media Files/icons/download.svg" alt="">
                <img src="Media Files/icons/export-image.svg" alt="">
            </div>
        </div>
    </nav>
    <main>
        <div class="kiri-main">
            <div class="first-kiri-main">
                <img src="Media Files/icons/move.svg" alt="">
                <img src="Media Files/icons/eraser.svg" alt="">
            </div>
            <div class="second-kiri-main">
                <img src="Media Files/icons/cone.svg" alt="">
                <img src="Media Files/icons/text.svg" alt="">
            </div>
            <div class="third-kiri-main">
                <img src="Media Files/icons/arrow.svg" alt="">
                <img src="Media Files/icons/arrow-run.svg" alt="">
                <img src="Media Files/icons/arrow-pass.svg" alt="">
                <img src="Media Files/icons/arrow-press.svg" alt="">
                <img src="Media Files/icons/line.svg" alt="">
                <img src="Media Files/icons/link.svg" alt="">
                <img src="Media Files/icons/path-find.svg" alt="">
            </div>
            <div class="fourth-kiri-main">
                <img src="Media Files/icons/zoom-in.svg" alt="">
                <img src="Media Files/icons/zoom-out.svg" alt="">
                <img src="Media Files/icons/theme.svg" alt="">
            </div>
        </div>
        <div class="tengah-main">
            <img src="Media Files/lapangan.svg" alt="">
            <div class="home-formation">
                <h1>HOME</h1>
                <select name="formation-home" id="formation" class="formation-home">
                    <option value="4-4-3">4-4-3</option>
                    <option value="4-3-3">4-3-3</option>
                </select>
            </div>
            <div class="enemy-formation">
                <h1>AWAY</h1>
                <select name="formation-home" id="formation" class="formation-home">
                    <option value="4-4-3">4-4-3</option>
                    <option value="4-3-3">4-3-3</option>
                </select>
            </div>
            <div class="tengah-bawah">
                <img src="Media Files/icons/plus.svg" alt="">
                <img src="Media Files/icons/minus.svg" alt="">
                <img src="Media Files/icons/frame.svg" alt="">
            </div>
        </div>
        <div class="kanan-main">
            
        </div>
    </main>
    <footer>
        <h1>Tool : <span>none</span></h1>
    </footer>
</body>

</html>

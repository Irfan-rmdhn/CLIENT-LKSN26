
<svg width="1050" height="680" viewBox="0 0 1050 680" xmlns="http://www.w3.org/2000/svg">
    <!-- Background -->
    <rect width="1050" height="680" fill="#176638"></rect>

    <!-- Touchlines -->
    <rect x="20" y="20" width="1010" height="640" fill="none" stroke="white" stroke-width="2"></rect>

    <!-- Center line -->
    <line x1="525" y1="20" x2="525" y2="660" stroke="white" stroke-width="2"></line>

    <!-- Center circle -->
    <circle cx="525" cy="340" r="90" fill="none" stroke="white" stroke-width="2"></circle>

    <!-- Center spot -->
    <circle cx="525" cy="340" r="5" fill="white"></circle>

    <!-- Left penalty area -->
    <rect x="20" y="160" width="165" height="360" fill="none" stroke="white" stroke-width="2"></rect>

    <!-- Right penalty area -->
    <rect x="865" y="160" width="165" height="360" fill="none" stroke="white" stroke-width="2"></rect>

    <!-- Left goal area -->
    <rect x="20" y="250" width="65" height="180" fill="none" stroke="white" stroke-width="2"></rect>

    <!-- Right goal area -->
    <rect x="965" y="250" width="65" height="180" fill="none" stroke="white" stroke-width="2"></rect>

    <!-- Penalty spots -->
    <circle cx="125" cy="340" r="4" fill="white"></circle>
    <circle cx="925" cy="340" r="4" fill="white"></circle>

    <!-- Corner arcs -->
    <path d="M 20 35 A 15 15 0 0 1 35 20" fill="none" stroke="white" stroke-width="2"></path>
    <path d="M 1015 20 A 15 15 0 0 1 1030 35" fill="none" stroke="white" stroke-width="2"></path>
    <path d="M 20 645 A 15 15 0 0 0 35 660" fill="none" stroke="white" stroke-width="2"></path>
    <path d="M 1015 660 A 15 15 0 0 0 1030 645" fill="none" stroke="white" stroke-width="2"></path>
</svg>
